name: Verify downloadable Mac app
on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Run packaged RDP on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
      - name: Verify checksum, architecture and signature
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          mkdir -p build/downloaded
          ditto -xk dist/FjarrConnect-*-macOS-universal.zip build/downloaded
          APP=build/downloaded/FjarrConnect.app
          lipo "$APP/Contents/MacOS/FjarrConnect" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Helpers/sdl-freerdp" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/Helpers/sdl-freerdp" /version
          python3 scripts/smoke-rdp.py "$APP/Contents/Helpers/sdl-freerdp"
