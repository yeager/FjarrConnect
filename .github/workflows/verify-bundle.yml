name: Verify downloadable Mac app
on:
  workflow_call:
    inputs:
      artifact-prefix:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Launch packaged app and RDP on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.arch }}
          path: dist
      - name: Verify checksum, architecture and signature
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          (cd dist && shasum -a 256 -c SHA256SUMS-${{ matrix.arch }}.txt)
          mkdir -p build/downloaded
          ditto -xk dist/FjarrConnect-*-macOS-${{ matrix.arch }}.zip build/downloaded
          APP=build/downloaded/FjarrConnect.app
          python3 scripts/check-resources.py --app "$APP"
          while IFS= read -r binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              test "$(lipo -archs "$binary")" = '${{ matrix.arch }}'
            fi
          done < <(find "$APP/Contents" -type f)
          test -f "$APP/Contents/Frameworks/RoyalVNCKit.framework/Versions/A/RoyalVNCKit"
          codesign --verify --deep --strict "$APP"
          python3 scripts/smoke-app.py "$APP" --check-missing-framework
          python3 scripts/smoke-rdp.py "$APP/Contents/Frameworks/libFjarrRDP.dylib"
