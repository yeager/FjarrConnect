name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rdp:
    uses: ./.github/workflows/rdp-runtime.yml
  tests:
    name: macOS regression tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - run: brew install xcodegen
      - run: python3 scripts/check-resources.py && xcodegen generate
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project FjarrConnect.xcodeproj -scheme FjarrConnect \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/test -resultBundlePath build/TestResults.xcresult \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test | tee build-test.log | xcbeautify
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-test-results
          path: |
            build/TestResults.xcresult
            build-test.log
            build/screenshots
          if-no-files-found: ignore
  build:
    name: Package macOS universal
    needs: [tests, rdp]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - run: brew install xcodegen
      - run: xcodegen generate
      - uses: actions/download-artifact@v4
        with:
          pattern: rdp-*
          path: build/rdp-artifacts
      - name: Build universal app
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FjarrConnect-universal
          path: dist/*
          if-no-files-found: error
