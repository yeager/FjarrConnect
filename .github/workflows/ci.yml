name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rdp:
    uses: ./.github/workflows/rdp-runtime.yml
  tests:
    name: macOS regression tests ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - run: brew install xcodegen xcbeautify
      - run: python3 scripts/check-resources.py && xcodegen generate
      - name: Test
        run: |
          set -o pipefail
          set +e
          python3 scripts/with-vnc-test-fixture.py xcodebuild -project FjarrConnect.xcodeproj -scheme FjarrConnect \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/test -resultBundlePath build/TestResults.xcresult \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test | tee build-test.log | xcbeautify
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            if [ "$test_status" -eq 65 ] && xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --format json | python3 -c 'import json, sys; result = json.load(sys.stdin); sys.exit(0 if result.get("passedTests", 0) > 0 and result.get("failedTests") == 0 else 1)'; then
              echo "::warning::xcodebuild returned 65 after a verified passing test result"
            else
              exit "$test_status"
            fi
          fi
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macOS-test-results-${{ matrix.arch }}
          path: |
            build/TestResults.xcresult
            build-test.log
            build/screenshots
          if-no-files-found: ignore
  build:
    name: Package macOS ${{ matrix.arch }}
    needs: [tests, rdp]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - run: brew install xcodegen xcbeautify
      - run: xcodegen generate
      - uses: actions/download-artifact@v7
        with:
          pattern: rdp-*
          path: build/rdp-artifacts
      - name: Build architecture-specific app
        run: bash scripts/build-release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: FjarrConnect-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  verify-download:
    needs: build
    uses: ./.github/workflows/verify-bundle.yml
    with:
      artifact-prefix: FjarrConnect
