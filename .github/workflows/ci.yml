name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Test and build macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install build tools
        run: brew install xcodegen
      - name: Check resources
        run: python3 scripts/check-resources.py
      - name: Generate project
        run: xcodegen generate
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project FjarrConnect.xcodeproj -scheme FjarrConnect \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/test -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test | tee build-test.log | xcbeautify
      - name: Build universal app
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-test-results
          path: |
            build/TestResults.xcresult
            build-test.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: FjarrConnect-universal
          path: dist/*
          if-no-files-found: error
