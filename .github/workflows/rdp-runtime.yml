name: Build bundled RDP runtime
on:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    name: FreeRDP ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/cache@v5
        id: runtime-cache
        with:
          path: build/rdp-output/${{ matrix.arch }}
          key: rdp-macos14-xcode16.4-${{ matrix.arch }}-${{ hashFiles('scripts/build-rdp.sh', 'NativeRDP/**') }}
      - uses: actions/cache/restore@v5
        id: dependencies
        with:
          path: build/rdp-${{ matrix.arch }}/install
          key: rdp-deps-mac14-${{ matrix.arch }}-openssl358-native-v2
      - name: Build static runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rdp.sh '${{ matrix.arch }}'
      - uses: actions/cache/save@v5
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: build/rdp-${{ matrix.arch }}/install
          key: rdp-deps-mac14-${{ matrix.arch }}-openssl358-native-v2
      - uses: actions/upload-artifact@v7
        with:
          name: rdp-${{ matrix.arch }}
          path: build/rdp-output/${{ matrix.arch }}
          if-no-files-found: error
