name: Build bundled RDP runtime
on:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    name: FreeRDP ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: build/rdp-output/${{ matrix.arch }}
          key: rdp-macos14-xcode16.4-${{ matrix.arch }}-${{ hashFiles('scripts/build-rdp.sh') }}
      - name: Build static runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rdp.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: rdp-${{ matrix.arch }}
          path: build/rdp-output/${{ matrix.arch }}
          if-no-files-found: error
