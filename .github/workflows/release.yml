name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rdp:
    uses: ./.github/workflows/rdp-runtime.yml
  secrets:
    name: Scan complete history with gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect \
            --source=/repo --config=/repo/.gitleaks.toml --redact --exit-code=1
  build:
    name: Test and package Mac ${{ matrix.arch }}
    needs: [secrets, rdp]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Verify version
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)"/\1/p' project.yml)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Install build tools
        run: brew install xcodegen
      - name: Check resources and generate project
        run: |
          python3 scripts/check-resources.py
          xcodegen generate
      - name: Run regression tests
        run: |
          set -o pipefail
          xcodebuild -project FjarrConnect.xcodeproj -scheme FjarrConnect \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/test -resultBundlePath build/TestResults.xcresult \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test | xcbeautify
      - uses: actions/download-artifact@v4
        with:
          pattern: rdp-*
          path: build/rdp-artifacts
      - name: Build and verify architecture-specific release
        run: bash scripts/build-release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  verify-download:
    needs: build
    uses: ./.github/workflows/verify-bundle.yml
    with:
      artifact-prefix: release-assets
  publish:
    name: Publish verified release
    needs: verify-download
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum FjarrConnect-*.zip > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "FjärrConnect ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md --verify-tag
