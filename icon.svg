<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Deep Nordic night sky -->
    <linearGradient id="sky" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2A5B"/>
      <stop offset="0.55" stop-color="#101A3D"/>
      <stop offset="1" stop-color="#0A0E23"/>
    </linearGradient>

    <!-- Aurora glow behind the arc apex -->
    <radialGradient id="auroraGlow" cx="512" cy="330" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BE9C0" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#4F9BFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4F9BFF" stop-opacity="0"/>
    </radialGradient>

    <!-- The Bifröst / connection arc -->
    <linearGradient id="arc" x1="250" y1="680" x2="774" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FE0B6"/>
      <stop offset="0.5" stop-color="#63E6A7"/>
      <stop offset="1" stop-color="#8A7CFF"/>
    </linearGradient>

    <!-- Soft top sheen, fades out with no hard edge -->
    <linearGradient id="sheen" x1="512" y1="100" x2="512" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
  </defs>

  <!-- Rounded-square tile -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#auroraGlow)"/>

    <!-- Stars -->
    <g fill="#FFFFFF">
      <circle cx="250" cy="240" r="5" opacity="0.55"/>
      <circle cx="360" cy="185" r="3.5" opacity="0.4"/>
      <circle cx="690" cy="210" r="4.5" opacity="0.5"/>
      <circle cx="780" cy="300" r="3" opacity="0.35"/>
      <circle cx="815" cy="200" r="4" opacity="0.45"/>
      <circle cx="205" cy="360" r="3" opacity="0.3"/>
    </g>

    <!-- Connection arc: stacked strokes give a soft glow without filters -->
    <g fill="none" stroke-linecap="round">
      <path d="M 250 690 Q 512 250 774 690" stroke="#4FE6C6" stroke-width="96" opacity="0.10"/>
      <path d="M 250 690 Q 512 250 774 690" stroke="#5CE3B8" stroke-width="70" opacity="0.16"/>
      <path d="M 250 690 Q 512 250 774 690" stroke="url(#arc)" stroke-width="52"/>
    </g>

    <!-- The two connected nodes (endpoints of the bridge) -->
    <g>
      <circle cx="250" cy="690" r="62" fill="#2FE0B6" opacity="0.22"/>
      <circle cx="250" cy="690" r="40" fill="#2FE0B6" opacity="0.35"/>
      <circle cx="250" cy="690" r="26" fill="#EAFFF8"/>

      <circle cx="774" cy="690" r="62" fill="#8A7CFF" opacity="0.22"/>
      <circle cx="774" cy="690" r="40" fill="#8A7CFF" opacity="0.35"/>
      <circle cx="774" cy="690" r="26" fill="#F2EEFF"/>
    </g>

    <!-- Subtle top sheen -->
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
</svg>
