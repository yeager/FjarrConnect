name: FjarrConnect

options:
  bundleIdPrefix: se.fjarrconnect
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  RoyalVNCKit:
    # Tested Unicode clipboard and active-session policy fork; protocol proposal: royalvnc#38.
    url: https://github.com/yeager/royalvnc
    revision: "03bf56cdd99292c466258c7b06d815bd47b3a57a"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.10.1"

targets:
  FjarrConnect:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
      - Model
      - Protocols
      - Discovery
      - Views
      - Resources
    dependencies:
      - package: RoyalVNCKit
        embed: true
      - package: SwiftTerm
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: FjärrConnect          # the ö lives here, in the display name
        CFBundleName: FjarrConnect
        CFBundleShortVersionString: "0.2.16"
        CFBundleVersion: "18"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Daniel Nylander"
        NSLocalNetworkUsageDescription: "Find VNC, RDP and SSH servers on your local network."
        NSBonjourServices:
          - _rfb._tcp
          - _rdp._tcp
          - _ssh._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.fjarrconnect.app
        PRODUCT_NAME: FjarrConnect
        MARKETING_VERSION: "0.2.16"
        CURRENT_PROJECT_VERSION: "18"
        SWIFT_VERSION: "5.0"
        ARCHS: "$(NATIVE_ARCH_ACTUAL)"
        ONLY_ACTIVE_ARCH: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FjarrConnectTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tests]
    dependencies:
      - target: FjarrConnect
      - package: RoyalVNCKit
        embed: false
      - package: SwiftTerm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  FjarrConnectUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources: [UITests]
    dependencies:
      - target: FjarrConnect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  FjarrConnect:
    build:
      targets:
        FjarrConnect: all
    test:
      targets: [FjarrConnectTests, FjarrConnectUITests]
    run:
      config: Debug
    archive:
      config: Release
