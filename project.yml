name: FjarrConnect

options:
  bundleIdPrefix: se.fjarrconnect
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc
    from: "1.0.0"

targets:
  FjarrConnect:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
      - Model
      - Protocols
      - Discovery
      - Views
      - Resources
    dependencies:
      - package: RoyalVNCKit
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: FjärrConnect          # the ö lives here, in the display name
        CFBundleName: FjarrConnect
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 yeager"
        NSLocalNetworkUsageDescription: "Find Macs sharing their screen on your local network."
        NSBonjourServices:
          - _rfb._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.fjarrconnect.app
        PRODUCT_NAME: FjarrConnect
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  FjarrConnect:
    build:
      targets:
        FjarrConnect: all
    run:
      config: Debug
    archive:
      config: Release
