name: FjarrConnect

options:
  bundleIdPrefix: se.fjarrconnect
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc
    exactVersion: "1.0.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.10.1"

targets:
  FjarrConnect:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
      - Model
      - Protocols
      - Discovery
      - Views
      - Resources
    dependencies:
      - package: RoyalVNCKit
      - package: SwiftTerm
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: FjärrConnect          # the ö lives here, in the display name
        CFBundleName: FjarrConnect
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 yeager"
        NSLocalNetworkUsageDescription: "Find Macs sharing their screen on your local network."
        NSBonjourServices:
          - _rfb._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.fjarrconnect.app
        PRODUCT_NAME: FjarrConnect
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FjarrConnectTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tests]
    dependencies:
      - target: FjarrConnect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  FjarrConnectUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources: [UITests]
    dependencies:
      - target: FjarrConnect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  FjarrConnect:
    build:
      targets:
        FjarrConnect: all
    test:
      targets: [FjarrConnectTests, FjarrConnectUITests]
    run:
      config: Debug
    archive:
      config: Release
